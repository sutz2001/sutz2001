<svg xmlns="http://www.w3.org/2000/svg" width="880" height="520" viewBox="0 0 880 520" role="img" aria-labelledby="title desc">
  <title id="title">sutz2001 - Marc</title>
  <desc id="desc">Retro Mac System 7 style about window for sutz2001 / Marc</desc>

  <defs>
    <pattern id="desktop" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#9a9a9a"/>
      <rect width="2" height="2" fill="#b0b0b0"/>
      <rect x="2" y="2" width="2" height="2" fill="#b0b0b0"/>
    </pattern>
    <style>
      .title {
        font-family: Charcoal, Chicago, Geneva, Tahoma, "Lucida Grande", sans-serif;
        font-size: 13px;
        fill: #000;
      }
      .brand {
        font-family: Charcoal, Chicago, Geneva, Tahoma, "Lucida Grande", sans-serif;
        font-size: 42px;
        font-weight: 700;
        fill: #000;
      }
      .name {
        font-family: Charcoal, Chicago, Geneva, Tahoma, "Lucida Grande", sans-serif;
        font-size: 22px;
        fill: #222;
      }
      .body {
        font-family: Geneva, Charcoal, Tahoma, "Lucida Grande", sans-serif;
        font-size: 15px;
        fill: #111;
      }
      .muted {
        font-family: Geneva, Charcoal, Tahoma, "Lucida Grande", sans-serif;
        font-size: 13px;
        fill: #444;
      }
      .section {
        font-family: Charcoal, Chicago, Geneva, Tahoma, "Lucida Grande", sans-serif;
        font-size: 13px;
        fill: #000;
      }
      .fact {
        font-family: Geneva, Charcoal, Tahoma, "Lucida Grande", sans-serif;
        font-size: 14px;
        fill: #111;
      }
      .cursor {
        animation: blink 1.05s steps(1, end) infinite;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Desktop -->
  <rect width="880" height="520" fill="url(#desktop)"/>

  <!-- Window chrome -->
  <g transform="translate(48, 36)">
    <!-- Outer shadow -->
    <rect x="4" y="4" width="780" height="440" fill="#000"/>
    <!-- Outer frame -->
    <rect x="0" y="0" width="780" height="440" fill="#fff" stroke="#000" stroke-width="2"/>
    <!-- Inner frame -->
    <rect x="3" y="3" width="774" height="434" fill="none" stroke="#000" stroke-width="1"/>

    <!-- Title bar -->
    <rect x="6" y="6" width="768" height="22" fill="#fff"/>
    <!-- Title bar stripes -->
    <g stroke="#000" stroke-width="1">
      <line x1="28" y1="9" x2="318" y2="9"/>
      <line x1="28" y1="11" x2="318" y2="11"/>
      <line x1="28" y1="13" x2="318" y2="13"/>
      <line x1="28" y1="15" x2="318" y2="15"/>
      <line x1="28" y1="17" x2="318" y2="17"/>
      <line x1="28" y1="19" x2="318" y2="19"/>
      <line x1="28" y1="21" x2="318" y2="21"/>
      <line x1="462" y1="9" x2="752" y2="9"/>
      <line x1="462" y1="11" x2="752" y2="11"/>
      <line x1="462" y1="13" x2="752" y2="13"/>
      <line x1="462" y1="15" x2="752" y2="15"/>
      <line x1="462" y1="17" x2="752" y2="17"/>
      <line x1="462" y1="19" x2="752" y2="19"/>
      <line x1="462" y1="21" x2="752" y2="21"/>
    </g>
    <!-- Close box -->
    <rect x="10" y="10" width="14" height="14" fill="#fff" stroke="#000" stroke-width="1.5"/>
    <!-- Title -->
    <rect x="318" y="6" width="144" height="22" fill="#fff"/>
    <text class="title" x="390" y="22" text-anchor="middle">About This Mac</text>

    <!-- Content area -->
    <rect x="10" y="34" width="760" height="390" fill="#fff" stroke="#000" stroke-width="1"/>

    <!-- Rainbow accent under title bar -->
    <g transform="translate(11, 35)">
      <rect x="0" y="0" width="126" height="4" fill="#61bb46"/>
      <rect x="126" y="0" width="126" height="4" fill="#fdb827"/>
      <rect x="252" y="0" width="127" height="4" fill="#f5821f"/>
      <rect x="379" y="0" width="126" height="4" fill="#e03a3e"/>
      <rect x="505" y="0" width="127" height="4" fill="#963d97"/>
      <rect x="632" y="0" width="126" height="4" fill="#009ddc"/>
    </g>

    <!-- Brand -->
    <text class="brand" x="390" y="110" text-anchor="middle">sutz2001</text>
    <text class="name" x="390" y="142" text-anchor="middle">Marc</text>
    <text class="body" x="390" y="172" text-anchor="middle">Business Intelligence Manager | Product Owner</text>
    <text class="muted" x="390" y="196" text-anchor="middle">Currently building a Cloud Data Platform - Azure &amp; Fabric</text>

    <!-- System Facts header -->
    <line x1="48" y1="224" x2="300" y2="224" stroke="#000" stroke-width="1"/>
    <text class="section" x="390" y="229" text-anchor="middle">System Facts</text>
    <line x1="480" y1="224" x2="732" y2="224" stroke="#000" stroke-width="1"/>

    <!-- Facts with colored bullets -->
    <circle cx="70" cy="258" r="5" fill="#e03a3e"/>
    <text class="fact" x="88" y="263">Certified Can Opener for Cats - premium 24/7 meow-based service</text>

    <circle cx="70" cy="288" r="5" fill="#fdb827"/>
    <text class="fact" x="88" y="293">Speaks fluent SQL and sarcasm</text>

    <circle cx="70" cy="318" r="5" fill="#61bb46"/>
    <text class="fact" x="88" y="323">Turns coffee into dashboards (conversion rate: highly caffeinated)</text>

    <circle cx="70" cy="348" r="5" fill="#009ddc"/>
    <text class="fact" x="88" y="353">Authorized Signatory by day, SELECT * detective by night</text>

    <!-- Footer line + location -->
    <line x1="48" y1="380" x2="732" y2="380" stroke="#000" stroke-width="1"/>
    <text class="muted" x="48" y="408" text-anchor="start">&gt;</text>
    <rect class="cursor" x="62" y="396" width="8" height="14" fill="#000"/>
    <text class="muted" x="390" y="408" text-anchor="middle">Germany - linkedin.com/in/seitzmarc</text>
  </g>
</svg>
