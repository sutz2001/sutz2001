<svg xmlns="http://www.w3.org/2000/svg" width="580" height="490" viewBox="0 0 580 490">
  <defs>
    <style>
      .bg { fill: #1e1e1e; }
      .titlebar { fill: #2d2d2d; }
      .titlebar-border { stroke: #3c3c3c; stroke-width: 1; }
      .dot-red { fill: #ff5f57; }
      .dot-yellow { fill: #febc2e; }
      .dot-green { fill: #28c840; }
      .title-text { fill: #999999; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; text-anchor: middle; }
      .comment { fill: #6a9955; font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace; font-size: 14px; }
      .keyword { fill: #569cd6; font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace; font-size: 14px; }
      .string { fill: #ce9178; font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace; font-size: 14px; }
      .func { fill: #c586c0; font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace; font-size: 14px; }
      .func-name { fill: #dcdcaa; font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace; font-size: 14px; }
      .prompt { fill: #6a9955; font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace; font-size: 14px; }
      .cmd { fill: #569cd6; font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace; font-size: 14px; }
      .link { fill: #00F7FF; font-family: 'SF Mono', 'Fira Code', 'Menlo', monospace; font-size: 14px; text-decoration: underline; }
    </style>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Window with shadow -->
  <rect class="bg" x="0" y="0" width="580" height="490" rx="8" filter="url(#shadow)"/>
  <rect class="bg" x="0" y="0" width="580" height="490" rx="8"/>

  <!-- Title bar -->
  <rect class="titlebar" x="0" y="0" width="580" height="36" rx="8"/>
  <rect class="titlebar" x="0" y="20" width="580" height="16"/>
  <line class="titlebar-border" x1="0" y1="36" x2="580" y2="36"/>

  <!-- Traffic lights -->
  <circle class="dot-red" cx="24" cy="18" r="6"/>
  <circle class="dot-yellow" cx="44" cy="18" r="6"/>
  <circle class="dot-green" cx="64" cy="18" r="6"/>

  <!-- Window title -->
  <text class="title-text" x="290" y="23">~/profile — bash</text>

  <!-- Terminal content -->
  <text class="comment" x="18" y="64"># Marc — @sutz2001</text>

  <text class="keyword" x="18" y="88">export</text>
  <text class="comment" x="80" y="88">ROLE=</text>
  <text class="string" x="130" y="88">"Business Intelligence Manager · Product Owner · Data & AI Architect"</text>

  <text class="keyword" x="18" y="112">export</text>
  <text class="comment" x="80" y="112">FOCUS=</text>
  <text class="string" x="133" y="112">"Data, AI & Analytics Leadership for digital transformation"</text>

  <text class="keyword" x="18" y="136">export</text>
  <text class="comment" x="80" y="136">STACK=(</text>
  <text class="string" x="148" y="136">"SQL" "JavaScript/TypeScript" "Python" "Home Assistant"</text>
  <text class="comment" x="485" y="136">)</text>

  <text class="func" x="18" y="168">function</text>
  <text class="func-name" x="90" y="168">work_on</text>
  <text class="comment" x="170" y="168">() {</text>

  <text class="prompt" x="18" y="192">  echo</text>
  <text class="string" x="80" y="192">"Cloud Data Platforms (Azure, Fabric, SAP)"</text>
  <text class="prompt" x="18" y="216">  echo</text>
  <text class="string" x="80" y="216">"AI & GenAI initiatives"</text>
  <text class="prompt" x="18" y="240">  echo</text>
  <text class="string" x="80" y="240">"Home automation tinkering"</text>

  <text class="comment" x="18" y="264">}</text>

  <text class="comment" x="18" y="296"># Fun facts</text>

  <text class="keyword" x="18" y="320">const</text>
  <text class="comment" x="66" y="320">funFacts = [</text>

  <text class="string" x="30" y="344">"Coffee enthusiast — powered by caffeine",</text>
  <text class="string" x="30" y="368">"Can-Opener (for cats, obviously)",</text>
  <text class="string" x="30" y="392">"Home Assistant addict"</text>

  <text class="comment" x="18" y="416">];</text>

  <text class="prompt" x="18" y="448">></text>
  <text class="cmd" x="36" y="448">./connect.sh --linkedin</text>
  <text class="link" x="230" y="448">linkedin.com/in/seitzmarc</text>

  <text class="prompt" x="18" y="472">></text>
  <rect class="cursor" fill="#00F7FF" x="36" y="458" width="10" height="18" rx="1"/>
</svg>